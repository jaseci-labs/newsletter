[project]
name = "jaseci-digest"
version = "0.1.0"
description = "Biweekly newsletter for the Jaseci & Jac open-source ecosystem."

[serve]
base_route_app = "app"
cl_route_prefix = "/"

[plugins.client]
enabled = true

[plugins.client.paths]
"@components/*" = "./components/*"
"@styles/*" = "./styles/*"

[plugins.scale]
enabled = true

[plugins.scale.kubernetes]
app_name = "newsletter"
namespace = "newsletter"
liveness_initial_delay = 300
liveness_failure_threshold = 10
readiness_initial_delay = 60

# `jaclang` is deliberately absent: the pod resolves the latest release at
# startup, matching the unpinned install.sh call in .github/workflows/deploy.yml.
# Adding a pin here without also pinning --version there splits the runner from
# the pod -- the runner generates the manifest, but the POD compiles this source,
# so the deploy reports success and the pod then fails to parse main.jac.
#
# That "latest" lookup hits the GitHub Releases API on every pod start. From the
# cluster it gets rate-limited and fails with "Could not determine latest version
# from GitHub Releases" unless authenticated -- which is what the GITHUB_TOKEN /
# GH_TOKEN entries in [plugins.scale.secrets] below are for. Removing them
# reintroduces that failure.
#
# jac_scale / jac_client are "none" because those PyPI packages no longer exist:
# scale and the client bundler ship inside jaclang as of the one-binary
# toolchain. Naming them here would drag the 0.16-era stack back in.
[plugins.scale.kubernetes.plugin_versions]
jac_scale = "none"
jac_client = "none"
jac_byllm = "none"
jac_mcp = "none"


[plugins.scale.secrets]
BUTTONDOWN_API_KEY = "${BUTTONDOWN_API_KEY}"
PUBLIC_BUTTONDOWN_USERNAME = "jaseci"
PUBLIC_SITE_URL = "https://newsletter.jaseci.org"
# Authenticate the toolchain installer's api.github.com calls inside the pod so
# they aren't rate-limited (the cause of "Failed to query GitHub API"). Resolved
# from the deploy step's env at deploy time.
GITHUB_TOKEN = "${GITHUB_TOKEN}"
GH_TOKEN = "${GITHUB_TOKEN}"

[dependencies]
markdown = ">=3.5"
pyyaml = ">=6.0"
# WORKAROUND for an upstream gap, not an app dependency -- nothing in this repo
# imports dotenv. jaclang's Kubernetes realizer does, at module scope
# (jaclang/scale/runtime/realizer/kubernetes_realizer.jac:3 --
# `import from dotenv { load_dotenv }`), but neither the shipped runtime nor
# `jac install --scale` installs python-dotenv, so `jac start --scale` dies with
# ModuleNotFoundError before it reaches the cluster. Declaring it here puts it in
# .jac/venv, which is on the import path for the deploy. Drop this once jaclang
# declares its own scale dependency.
python-dotenv = ">=1.0"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.2"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"


