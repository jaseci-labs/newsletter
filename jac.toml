[project]
name = "jaseci-digest"
version = "0.1.0"
description = "Biweekly newsletter for the Jaseci & Jac open-source ecosystem."
# REQUIRED since jaclang 0.37: the project kind decides execute-vs-serve, and an
# undeclared kind defaults to "cli". That is what took the site down after the
# 0.37 upgrade: `jac scale deploy` sealed the app as kind=cli, so the pod ran
# main.jac as a script, exited, and every request 503'd (including /healthz).
# "web-app" is server walkers + client UI, which is what this is. Verify with
# `jac run --show` -- it must say action: serve, not action: execute.
kind = "web-app"

[serve]
base_route_app = "app"
# Keep this at the default "cl". Setting it to "/" registers the per-page route
# as "///{page_name}", which ends up matching every one-segment root path ahead
# of the static-asset handler: on the deployed site /logo.png, /about and
# /issues all returned "<h1>404 Not Found</h1>" while two-segment paths
# (/issues/005, /styles/main.css, /issues/001/workspace.png) resolved fine.
# The SPA still mounts at "/" via base_route_app, so this prefix only affects
# the direct per-page render endpoint, which nothing here links to.
cl_route_prefix = "cl"

# CONFIG NAMESPACE: these are [scale.*] / [client.*], NOT [plugins.scale.*] /
# [plugins.client.*]. The one-binary toolchain folded jac-scale into core
# (jaseci#7034) and reads the unprefixed sections; the [plugins.*] spelling is
# silently IGNORED -- no error, it just falls back to defaults. That is what
# happened on run 30420047383, which deployed app 'jaseci-digest' (the [project]
# name) into namespace 'default' instead of 'newsletter', with none of the
# secrets below attached. If a deploy ever logs the wrong app or namespace in
# its "Deploying application ... Context: {...}" line, check this prefix first.
#
# Dropped in the migration, deliberately:
#   - `[plugins.client] enabled` / `[plugins.scale] enabled` -- there is nothing
#     to enable now that both are in core; declaring any [scale.*] section is
#     what opts in, and client bundling is detected from the source.
#   - `[plugins.client.paths]` (@components/*, @styles/*) -- no file in this
#     repo imports either alias, so it was dead config; not worth carrying to a
#     new key name that cannot be verified.
#   - `[...kubernetes.plugin_versions]` -- obsolete. Pods no longer install a
#     toolchain from GitHub Releases; the runner downloads the stable binary and
#     ships it to pods over the bundle PVC (jaseci#7084), which the deploy log
#     shows as "Preparing the 'stable' jac runtime for pods."
[scale.kubernetes]
app_name = "newsletter"
namespace = "newsletter"
# The bundle PVC that carries the jac binary + app code to the pods is
# ReadWriteMany. This cluster's default class (gp3, ebs.csi.aws.com) is RWO and
# rejects RWX with "InvalidArgument desc = Volume capabilities not supported",
# which is how run 30420047383 failed: the jaseci-digest-bundle-loader pod sat
# Pending until timeout on all three attempts. efs-sc (efs.csi.aws.com) is the
# cluster's RWX class -- confirmed present in the deploy's `kubectl get sc`
# baseline. jacBuilder pins the same class on production-cluster for the same
# reason.
bundle_storage_class = "efs-sc"
liveness_initial_delay = 300
liveness_failure_threshold = 10
readiness_initial_delay = 60

[scale.secrets]
BUTTONDOWN_API_KEY = "${BUTTONDOWN_API_KEY}"
PUBLIC_BUTTONDOWN_USERNAME = "jaseci"
PUBLIC_SITE_URL = "https://newsletter.jaseci.org"
# Retained for the pod-side GitHub API path. Likely vestigial now that the
# runner ships the binary over the bundle PVC rather than the pod fetching it,
# but they are harmless and removing them is a separate question from this
# migration. Resolved from the deploy step's env at deploy time.
GITHUB_TOKEN = "${GITHUB_TOKEN}"
GH_TOKEN = "${GITHUB_TOKEN}"

[dependencies]
markdown = ">=3.5"
# Floor is 6.0.3, not 6.0: the 0.37 runtime bundles CPython 3.14, and 6.0.3 is
# the first (and so far only) PyYAML release publishing cp314 wheels. Anything
# older has no matching distribution for the target ABI, which is what made the
# deploy log say "Could not find a version that satisfies the requirement
# pyyaml>=6.0 (from versions: none)" and fall back to a thin bundle. PyYAML is
# the only C-extension dependency here; the rest are pure Python.
pyyaml = ">=6.0.3"
# Required by jac_syntax_highlighter.jac (RegexLexer + the token types) and by
# markdown's `codehilite` extension. It currently resolves anyway because the jac
# runtime bundles pygments in its own site directory, but that is an implementation
# detail of the toolchain, not a promise. Declared so the app owns its dependency.
pygments = ">=2.17"
# WORKAROUND for an upstream gap, not an app dependency -- nothing in this repo
# imports dotenv. jaclang's Kubernetes realizer does, at module scope
# (jaclang/scale/runtime/realizer/kubernetes_realizer.jac:3 --
# `import from dotenv { load_dotenv }`), but neither the shipped runtime nor
# `jac install --scale` installs python-dotenv, so `jac start --scale` dies with
# ModuleNotFoundError before it reaches the cluster. Declaring it here puts it in
# .jac/venv, which is on the import path for the deploy. Drop this once jaclang
# declares its own scale dependency.
python-dotenv = ">=1.0"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.2"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

