name: Deploy newsletter with jac-scale

on:
  push:
    branches: [main]
    paths:
      - 'main.jac'
      - 'pages/**'
      - 'src/**'
      - 'styles/**'
      - 'components/**'
      - 'jac.toml'
      - 'package.json'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.2.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::776241927220:role/GitHubActionsJaseciDeployRole
          role-session-name: GitHubActions-Newsletter
          audience: sts.amazonaws.com

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region us-east-2 --name jaseci-cluster
          kubectl config current-context

      # Not required by the toolchain itself -- the jac binary bundles its own
      # runtime and nothing here is pip-installed anymore. Retained because
      # `jac install` resolves [dependencies] into .jac/venv and may reach for a
      # system interpreter to do it; pinning keeps that predictable.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Jac toolchain
        env:
          # install.sh resolves the release through api.github.com, and tracking
          # latest means it does that lookup on EVERY deploy. Unauthenticated calls
          # are rate-limited and fail with "Failed to query GitHub API for latest
          # release" / "Could not determine latest version from GitHub Releases";
          # the script picks GITHUB_TOKEN up and authenticates, raising the ceiling
          # to ~1000/hr. Do not drop this env block.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One-binary jac: a single self-contained executable, no PyPI packages.
          # `scale` and the client bundler now ship INSIDE jaclang -- the jac-scale
          # and jac-client packages no longer exist. Installing the old pinned set
          # here would pull the 0.16-era parser, which cannot read this source
          # (parenthesized lambda params, `as` casts).
          #
          # UNPINNED BY CHOICE: no --version, so this tracks the latest release.
          # jac.toml leaves the pod's jaclang version unpinned to match. Two things
          # follow from that, and they are the first places to look when a deploy
          # breaks with no diff in this repo:
          #   - a breaking jac release breaks the deploy without a commit here
          #     (0.16 -> 0.32 changed lambda syntax and did exactly this);
          #   - runner and pod resolve latest independently, so a release landing
          #     mid-deploy can leave them on different versions.
          # `jac --version` in the next step records what was actually resolved.
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh \
            | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve project dependencies
        run: |
          jac --version
          # Resolves [dependencies] + [dependencies.npm] into .jac/, plus the
          # kubernetes/docker clients --scale needs. The deploy step would do this
          # on first run anyway; doing it here fails fast and keeps dependency
          # errors out of the deploy step's output.
          #
          # No --dry-run rehearsal below: `jac start --scale --dry-run` is only
          # implemented for the kubernetes-microservice target and no-ops with a
          # warning on the plain `kubernetes` target this app uses.
          jac install --scale

      - name: Pre-deploy cluster baseline
        run: |
          echo "::group::StorageClasses (need a default)"
          kubectl get sc
          echo "::endgroup::"
          echo "::group::EBS CSI driver status"
          kubectl get pods -n kube-system -l app=ebs-csi-controller || true
          echo "::endgroup::"
          echo "::group::Current state of newsletter namespace"
          kubectl get pvc,pods,events -n newsletter --sort-by=.metadata.creationTimestamp || true
          echo "::endgroup::"

      - name: Deploy newsletter with jac-scale
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          # Passed through to the pod (via [plugins.scale.secrets]) so the
          # toolchain installer's api.github.com calls are authenticated.
          # Unauthenticated API calls from the cluster get rate-limited (60/hr)
          # and fail with "Failed to query GitHub API"; an authenticated token
          # raises that to ~1000/hr. The binary download host (github.com) was
          # never the problem -- only the api.github.com lookup.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jac start main.jac --scale

      - name: Diagnose deploy failure
        if: failure()
        run: |
          echo "::group::PVC status (most common blocker)"
          kubectl get pvc -n newsletter
          kubectl describe pvc -n newsletter
          echo "::endgroup::"
          echo "::group::Pods + describe for code-sync"
          kubectl get pods -n newsletter
          kubectl describe pod -n newsletter -l app=newsletter-code-sync || true
          kubectl describe pod newsletter-code-sync -n newsletter || true
          echo "::endgroup::"
          echo "::group::Recent namespace events (warnings first)"
          kubectl get events -n newsletter --sort-by=.lastTimestamp --field-selector type!=Normal || true
          kubectl get events -n newsletter --sort-by=.lastTimestamp | tail -30
          echo "::endgroup::"

      - name: Verify deployment
        if: success()
        run: |
          echo "Checking deployment status..."
          kubectl get deployments -n newsletter
          kubectl get services -n newsletter
          kubectl get pods -n newsletter

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Newsletter Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name**: newsletter" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: newsletter" >> $GITHUB_STEP_SUMMARY
          echo "- **Host**: newsletter.jaseci.org" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: jaseci-cluster" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: us-east-2" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get all -n newsletter 2>&1 >> $GITHUB_STEP_SUMMARY || echo "Unable to fetch deployment status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
